name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/ecg_denoising
      - run: pytest --cov=ecg_denoising --cov-report=term-missing
      - name: Smoke-test complete pipeline
        run: python -m ecg_denoising.cli pipeline --config configs/quick.yaml
