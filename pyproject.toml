[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ecg-motion-denoising"
version = "0.1.0"
description = "Reproducible MLOps pipeline for ECG motion-artefact denoising"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ben Russell" }]
dependencies = [
  "dvc>=3.59,<4",
  "mlflow>=2.20,<4",
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.12,<2",
  "tensorboard>=2.18,<3",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
ecg-denoise = "ecg_denoising.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_denoising"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["coursework", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ecg_denoising"]
ignore_missing_imports = true
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["attr-defined", "import-untyped", "no-untyped-call"]
