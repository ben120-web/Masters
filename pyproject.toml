[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ecg-motion-denoising"
version = "1.1.0"
description = "Reproducible MLOps pipeline for ECG motion-artefact denoising"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ben Russell" }]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
mlops = [
  "dvc>=3.59,<4",
  "mlflow>=2.20,<4",
  "scipy>=1.12,<2",
  "tensorboard>=2.18,<3",
]
serve = [
  "fastapi>=0.115,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]
dev = [
  "build>=1.2,<2",
  "dvc>=3.59,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mlflow>=2.20,<4",
  "mypy>=1.14,<3",
  "pre-commit>=4,<5",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "scipy>=1.12,<2",
  "tensorboard>=2.18,<3",
  "types-PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
ecg-denoise = "ecg_denoising.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_denoising"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "legacy",
  "coursework/control_and_estimation",
  "coursework/kalman_filter",
  "coursework/quadcopter_control/controlSystem.py",
  "coursework/quadcopter_control/controlSystemMPC.py",
  "coursework/quadcopter_control/controlSystemPID.py",
  "coursework/quadcopter_control/kalmanFilter.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = [
  "src/ecg_denoising",
  "coursework/aircraft_mpc",
  "coursework/quadcopter_control/model_predictive_controller.py",
  "coursework/quadcopter_control/demo.py",
]
ignore_missing_imports = true
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["attr-defined", "import-untyped", "no-untyped-call"]
